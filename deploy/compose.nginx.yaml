services:
  db:
    ports: !reset []
  backend:
    environment:
      APP_BASE_PATH: ${APP_BASE_PATH:?Set the public Nginx path in .env}
    ports:
      - "127.0.0.1:18081:3000"
  web:
    build:
      args:
        VITE_BASE_PATH: ${APP_BASE_PATH:?Set the public Nginx path in .env}/
    environment:
      SITE_ADDRESS: "http://:80"
    ports: !override
      - "127.0.0.1:18080:80"
