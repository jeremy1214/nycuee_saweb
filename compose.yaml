services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nycuee
      POSTGRES_USER: nycuee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nycuee -d nycuee"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://nycuee:${POSTGRES_PASSWORD}@db:5432/nycuee
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: "true"
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MEDIA_ROOT: /var/lib/nycuee/media
      ANONYMOUS_SESSION_IP_LIMIT: ${ANONYMOUS_SESSION_IP_LIMIT-30}
      ANONYMOUS_SESSION_GLOBAL_LIMIT: ${ANONYMOUS_SESSION_GLOBAL_LIMIT-300}
    volumes:
      - media_data:/var/lib/nycuee/media
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health', { signal: AbortSignal.timeout(4000) }).then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_ACTIVITY_SOURCE: ${VITE_ACTIVITY_SOURCE:-api}
        VITE_EESA_SOURCE: ${VITE_EESA_SOURCE:-json}
        VITE_TEAM_SOURCE: ${VITE_TEAM_SOURCE:-json}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  media_data:
  postgres_data:
  caddy_data:
  caddy_config:
